<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style/signIn.css">
</head>
<body>
    <section id="signIn">
        <form action="index2.html">
            <label">Nombre de usuario: <input type="text" minlength="3" maxlength="15" pattern="[a-zA-Z0-9]" required></label>
            <label">Contraseña: <input type="password" pattern="[a-zA-Z0-9]-_" required></label>
            <label">Repita la contraseña: <input type="password" required></label>
            <label">Email: <input type="email" required></label>
            <label">Sexo: <input type="text" required></label>
            <label">Fecha de nacimiento: <input type="text" required></label>
            <label">Ciudad de residencia: <input type="text" ></label>
            <label">País de residencia: <input type="text" ></label>
            <label">Foto: <input type="file" ></label>
            <input type="submit">
        </form>
    </section>
</body>
</html>
